[theme]
base = "light"
# Paradigm orange: Streamlit's own controls (toggles, sliders, focus rings)
# take this, and it reads on both the light ground and the dark navy one.
primaryColor = "#cd4f17"
backgroundColor = "#f2f4f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#00131f"
font = "'Sofia Sans':https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&display=swap, sans-serif"

[server]
headless = true
