[theme]
base = "light"
primaryColor = "#cd4f17"
backgroundColor = "#fefefe"
secondaryBackgroundColor = "#f1f1f1"
textColor = "#000000"
font = "'Figtree':https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap, sans-serif"
headingFont = "'Libre Caslon Text':https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&display=swap, serif"

[server]
headless = true

[browser]
gatherUsageStats = false
