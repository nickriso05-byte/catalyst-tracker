<div class="app">
  <header class="mast">
    <div class="mast-in">
      <div class="brand">
        <div class="eyebrow">Ray Blanco's Catalyst Trader</div>
        <h1>FDA Catalyst Tracker</h1>
      </div>
      <div class="mast-right">
        <span class="stamp" id="stamp"></span>
        <button class="refresh" id="refresh" title="Re-check SEC filings and market data now">Refresh</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis"></section>

    <div class="toolbar">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search any healthcare ticker, company or drug" autocomplete="off">
        <div class="lookup" id="lookup" hidden></div>
      </div>
      <div class="seg" id="win" role="group" aria-label="Time window">
        <button data-v="30">30D</button><button data-v="90">90D</button><button data-v="180" class="on">6M</button><button data-v="365">12M</button><button data-v="9999">All</button>
      </div>
      <select id="cap" aria-label="Market cap">
        <option value="0">Any market cap</option><option value="300e6">Under $300M</option><option value="1e9">Under $1B</option>
        <option value="5e9">Under $5B</option><option value="20e9">Under $20B</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="date">Soonest first</option><option value="score">Highest score</option><option value="implied">Biggest implied move</option><option value="short">Most shorted</option>
      </select>
      <label class="toggle"><input type="checkbox" id="exact"><span class="sw"></span>Exact dates</label>
    </div>
    <div class="chips" id="chips"></div>

    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="cal">Calendar</button>
      <button class="tab" data-tab="scr">Screens</button>
      <span class="count" id="calcount"></span>
    </nav>

    <section id="cal"><div id="groups"></div></section>
    <section id="scr" hidden><div class="screens" id="screens"></div></section>
    <footer class="foot" id="foot"></footer>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Company card"><div class="sheet" id="sheet"></div></div>
</div>
