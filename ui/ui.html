<div class="ct-root">
<div class="topbar"><div class="in"><div class="brand">CATALYST TRACKER <span>· FDA &amp; Biotech</span></div><div class="stamp" id="stamp"></div></div></div>
<div class="subnav"><div class="in">Ray Blanco's Catalyst Trader</div></div>
<div class="wrap">
  <div class="card">
    <div class="cardhead">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="cal">Calendar</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="scr">Screens</button>
      </div>
      <div class="pubtitle">FDA Catalyst Tracker</div>
    </div>
    <div class="body">
      <section id="cal">
        <h2 class="sechead">Upcoming catalysts <small id="calcount"></small></h2>
        <div class="filters">
          <input class="search" id="q" type="search" placeholder="Search any healthcare ticker, company or drug" autocomplete="off">
          <select id="win" aria-label="Time window">
            <option value="30">Next 30 days</option><option value="90">Next 90 days</option>
            <option value="180" selected>Next 6 months</option><option value="365">Next 12 months</option><option value="9999">All upcoming</option>
          </select>
          <select id="cap" aria-label="Market cap">
            <option value="0">Any market cap</option><option value="300e6">Under $300M</option><option value="1e9">Under $1B</option>
            <option value="5e9">Under $5B</option><option value="20e9">Under $20B</option>
          </select>
          <select id="prec" aria-label="Date precision">
            <option value="all">Exact dates &amp; windows</option><option value="day">Exact dates only</option>
          </select>
        </div>
        <div class="lookup" id="lookup" hidden></div>
        <div class="chips" id="chips"></div>
        <div class="tablewrap"><table>
          <thead><tr><th>When</th><th>Ticker</th><th>Event</th><th class="hide-sm">Drug / program</th><th class="num">Mkt cap</th>
          <th class="num">Short % float</th><th class="num">Cash runway</th><th class="num hide-sm">Implied move</th><th class="num hide-sm" title="Historical average for drugs at this stage (BIO/Informa 2011-2020). Not drug-specific odds.">Hist. odds</th><th class="num hide-sm" title="Verdad-style score, 0–100: top-tier specialist funds, short interest, insider buying, value vs. spending">Score</th><th class="hide-sm">Signals</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>
      <section id="scr" hidden>
        <h2 class="sechead">Screens <small>Names with an upcoming catalyst that pass each test</small></h2>
        <div class="screens" id="screens"></div>
      </section>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Ticker detail"></aside>
</div>
